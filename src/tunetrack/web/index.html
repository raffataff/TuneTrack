<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TuneTrack Studio</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body data-room="studio">
<header id="top">
  <div class="plate" title="TuneTrack Studio"><b>TUNETRACK</b><i>STUDIO</i></div>
  <button id="projBtn" class="ghost" title="Open / new project"><span id="projName">No project</span> ▾</button>
  <div class="sep"></div>
  <div class="cluster">
    <button id="playBtn" class="key" title="Render what changed, then play (Space)">▶</button>
    <button id="stopBtn" class="key" title="Stop">■</button>
    <button id="loopBtn" class="key toggle" title="Loop the loop region">⟲</button>
    <span id="pos" class="vfd">1:1.00</span>
    <span id="audioState" class="tag" title="Playback is a render of the project, not a live engine. This shows whether the audio you hear matches the current revision.">NO RENDER</span>
  </div>
  <span id="status" class="status"></span>
  <div class="sep deskonly"></div>
  <label class="field deskonly">BPM <input id="tempo" type="number" min="20" max="300" step="1"></label>
  <label class="field deskonly">KEY <input id="key" type="text" size="10"></label>
  <label class="field deskonly">SIG <input id="sig" type="text" size="4"></label>
  <label class="field deskonly">SNAP <select id="snap">
    <option value="4">Bar</option><option value="1" selected>1/4</option><option value="0.5">1/8</option>
    <option value="0.25">1/16</option><option value="0.3333333">1/8T</option><option value="0.125">1/32</option>
    <option value="0">Off</option></select></label>
  <div class="spacer"></div>
  <div class="cluster crew" title="The crew: the agents you have put in seats">
    <span class="legend">CREW</span>
    <button id="crewBtn" class="key switch" title="Let the seated agents work / stop them">RUN</button>
    <button id="briefBtn" class="key" title="Give the Producer a new brief">BRIEF</button>
    <span id="crewRead" class="vfd small">STANDBY</span>
  </div>
  <button id="needsBtn" class="key needs" title="What is waiting on you"><i class="lamp"></i>NEEDS YOU <b id="needsCount">0</b></button>
  <nav id="rooms" title="Studio: the crew. Desk: arrangement, piano roll and mixer.">
    <button data-room="studio" class="active">STUDIO</button><button data-room="desk">DESK</button>
  </nav>
  <button id="undoBtn" class="ghost deskonly" title="Undo (Ctrl+Z)">↶</button>
  <button id="redoBtn" class="ghost deskonly" title="Redo (Ctrl+Y)">↷</button>
  <button id="exportBtn" class="key" title="Render deliverables">EXPORT</button>
</header>

<main id="studio">
  <section id="rack" aria-label="The crew rack">
    <div class="rail"></div>
    <div id="units"></div>
    <div class="rail"></div>
  </section>
  <aside id="side">
    <section id="needs" class="bay">
      <h2><i class="lamp"></i>NEEDS YOU <span id="needsHead" class="count"></span></h2>
      <div id="needsList" class="bayBody"></div>
    </section>
    <section id="monitor" class="bay">
      <h2>MONITOR · TALKBACK
        <span class="h2tools"><button id="repBtn" class="mini" title="Reports the crew has filed, and the scorecard of how each agent did">REPORTS</button> <button id="tbFilter" class="mini toggle" title="Show only what was said (hide activity)">TALK ONLY</button></span></h2>
      <div id="tbLog" class="bayBody"></div>
      <div id="tbTargets" title="Who hears you"></div>
      <form id="tbForm" autocomplete="off">
        <input id="tbText" placeholder="Talk to the Producer…" maxlength="2000">
        <button class="key talk" title="Send (Enter)">TALK</button>
      </form>
    </section>
  </aside>
</main>

<div id="desk">
  <div id="takeBar" class="hidden" title="What the desk is editing: the session itself, or a take of it">
    <span class="legend">EDITING</span>
    <i id="takeLamp" class="lamp green"></i>
    <select id="takeSel" title="Switch between the session and its takes"></select>
    <span id="takeRead" class="vfd small"></span>
    <span id="takeTags"></span>
    <span class="spacer"></span>
    <button id="takeNew" class="key" title="Work in a private copy of the session and hand it in when it is ready">CUT A TAKE…</button>
    <button id="takeChanges" class="key hidden" title="What this take changes compared with the session it was cut from">CHANGES</button>
    <button id="takeSync" class="key hidden" title="Bring what the session has accepted since this take was cut into the take">SYNC</button>
    <button id="takeSubmit" class="key go hidden" title="Hand the take in to be auditioned and accepted">HAND IN…</button>
    <button id="takeLeave" class="key hidden" title="Leave the take as it is and show the session">BACK TO SESSION</button>
  </div>
  <main id="arr">
    <div id="headers">
      <div id="rulerCorner">
        <button id="addMidi" class="ghost small" title="Add instrument track">+ Inst</button>
        <button id="addAudio" class="ghost small" title="Add audio track">+ Audio</button>
        <button id="addBus" class="ghost small" title="Add bus (shared FX)">+ Bus</button>
      </div>
      <div id="chordCorner" title="The chord track: the harmony every part is checked against. Double-click a bar to write its chord.">
        <span class="legend">CHORDS</span>
        <button id="chordSet" class="ghost small" title="Write a progression over a section, the loop, or from the playhead">Write…</button>
      </div>
      <div id="trackHeaders"></div>
    </div>
    <div id="timeline">
      <canvas id="ruler"></canvas>
      <div id="chordLane"><canvas id="chords"></canvas><input id="chordEdit" class="hidden" spellcheck="false" autocomplete="off" aria-label="Chord"></div>
      <div id="lanesWrap"><canvas id="lanes"></canvas></div>
    </div>
  </main>

  <section id="bottom">
    <nav id="tabs">
      <button data-tab="roll" class="active">Piano roll</button>
      <button data-tab="mixer">Mixer</button>
      <button data-tab="inspector">Track</button>
      <button data-tab="report">Render report</button>
      <button data-tab="brief">Brief</button>
      <div class="spacer"></div>
      <span id="rollInfo" class="muted"></span>
    </nav>
    <div id="panel-roll" class="panel active">
      <div id="rollWrap"><canvas id="roll"></canvas></div>
      <canvas id="vel"></canvas>
    </div>
    <div id="panel-mixer" class="panel"><div id="mixer"></div></div>
    <div id="panel-inspector" class="panel"><div id="inspector" class="pad"></div></div>
    <div id="panel-report" class="panel"><div id="report" class="pad"></div></div>
    <div id="panel-brief" class="panel"><div id="brief" class="pad"></div></div>
  </section>
</div>

<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="menu" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script src="/web/app.js"></script>
<script src="/web/studio.js"></script>
</body>
</html>
