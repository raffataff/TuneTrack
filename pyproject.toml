[project]
name = "tunetrack"
version = "0.1.0"
description = "AI-controllable multitrack music workstation for game soundtracks (VST3, SFZ, built-in synths, MCP)"
authors = [
    { name = "raffataff" }
]
requires-python = ">=3.12"
dependencies = [
    "dawdreamer>=0.9.0",
    "mcp>=2.3.0",
    "mido>=1.3.3",
    "numpy>=2.5.4",
    "pedalboard>=0.9.26",
    "pillow>=13.0.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
tunetrack = "tunetrack:main"
tunetrack-mcp = "tunetrack.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
